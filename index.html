<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#172126;--muted:#6d7a80;--line:#e1e7e9;--red:#a51f24;--red2:#7d171b;--soft:#fff1f1;--green:#16834b;--gold:#b7791f;--shadow:0 12px 35px rgba(23,33,38,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#151d21,#303b40);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px #0002}.brand{font-weight:900;font-size:20px;white-space:nowrap}.brand small{display:block;font-size:10px;opacity:.65;font-weight:600}.nav{display:flex;gap:6px;align-items:center;flex:1;overflow-x:auto;padding-bottom:2px}.nav button{background:transparent;color:#dce4e7;padding:10px 11px;border-radius:10px;white-space:nowrap;font-weight:750}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.db-status{margin-left:auto;white-space:nowrap;padding:7px 10px;border-radius:999px;background:#ffffff12;font-size:11px;font-weight:800}.db-status.ok{background:#16834b33}
.container{width:min(1220px,100%);margin:auto;padding:22px 16px}.hero{background:linear-gradient(135deg,#fff,#fff5f5);border:1px solid #f0d8d8;border-radius:24px;padding:30px;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;box-shadow:var(--shadow)}.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.05;margin:8px 0}.hero p{color:var(--muted);line-height:1.7}.hero img{width:100%;height:270px;object-fit:cover;border-radius:18px}.eyebrow,.badge{display:inline-flex;align-items:center;gap:5px;background:#f9dfdf;color:var(--red);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.5px}.btn{background:var(--red);color:#fff;padding:11px 16px;border-radius:11px;font-weight:850;min-height:44px}.btn:hover{background:var(--red2)}.btn.secondary{background:#edf1f2;color:#26343a}.btn.green{background:var(--green)}.btn.danger{background:#762226}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:28px 0 14px}.section-title h2{margin:0}.muted{color:var(--muted)}label{font-size:13px;font-weight:800;display:block;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid #d3dde0;border-radius:11px;padding:12px;background:#fff;outline:none;min-height:45px}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#c85a5d;box-shadow:0 0 0 3px #a51f2412}.product-card{overflow:hidden}.product-card img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px}.product-card h3{margin:0 0 7px}.price{font-weight:950;color:var(--red);font-size:18px}.product-meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.product-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.product-actions .btn{flex:1;min-width:120px}.stock{font-size:11px;font-weight:900;color:var(--green)}.stock.off{color:#9a2b2b}.notice{padding:12px 14px;border-radius:11px;background:#f6f8f9;color:#526167;margin:8px 0}.toast{position:fixed;right:16px;bottom:16px;z-index:9999;background:#172126;color:#fff;padding:14px 16px;border-radius:13px;box-shadow:0 14px 45px #0004;display:none;max-width:min(380px,calc(100vw - 32px))}.toast.show{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat strong{display:block;font-size:28px;margin-top:6px}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.data-table th{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;z-index:500;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modal-box{background:#fff;width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:20px}.modal-box h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions .btn{min-width:120px}.login-wrap{min-height:78vh;display:grid;place-items:center}.login{width:min(470px,100%);padding:25px;border-radius:24px}.role{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.role button{padding:12px;border-radius:11px;background:#edf1f2;font-weight:900}.role button.selected{background:var(--red);color:#fff}.cart-item{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:5px}.qty button{width:34px;height:34px;border-radius:9px;background:#edf1f2;font-weight:900}.qty strong{min-width:28px;text-align:center}.cart-total{display:flex;justify-content:space-between;gap:12px;font-size:20px;font-weight:950;padding-top:15px}.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.contact-card{display:flex;gap:12px;align-items:center}.contact-icon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--soft);font-size:23px}.chat-layout{display:grid;grid-template-columns:300px 1fr;gap:14px;min-height:620px}.inbox{max-height:620px;overflow:auto}.customer-item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}.customer-item:hover,.customer-item.selected{background:#fff2f2}.messages{height:475px;overflow:auto;padding:15px;background:#f7f9fa;border-radius:12px}.msg{max-width:78%;padding:10px 12px;border-radius:14px;margin:7px 0}.msg.customer{background:#fff;border:1px solid var(--line);margin-right:auto}.msg.admin{background:#ffe4e4;margin-left:auto}.msg small{display:block;color:#879399;font-size:10px;margin-top:5px}.composer{display:flex;gap:8px;align-items:end;margin-top:10px}.composer textarea{height:46px;min-height:46px}.file-btn{background:#edf1f2;padding:11px;border-radius:10px}.file-btn input{display:none}.announcement{border-left:4px solid var(--red)}.empty{text-align:center;color:var(--muted);padding:35px 15px}.install-card{background:linear-gradient(135deg,#fff,#f4f9ff)}footer{text-align:center;color:#8a969b;padding:25px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chat-layout{grid-template-columns:1fr}.inbox{max-height:240px}}
@media(max-width:620px){.topbar{align-items:flex-start;flex-direction:column;padding:11px}.brand{font-size:18px}.nav{width:100%;order:2}.db-status{position:absolute;right:10px;top:11px}.container{padding:13px 10px}.hero{padding:20px;border-radius:19px}.hero img{height:205px}.grid2,.grid3,.contact-grid,.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.section-title{align-items:flex-start;flex-direction:column}.product-card img{height:175px}.modal{padding:6px;align-items:flex-start}.modal-box{max-height:96vh;border-radius:15px;padding:14px}.actions{display:grid;grid-template-columns:1fr}.actions .btn,.product-actions .btn{width:100%;min-width:0}.cart-item{grid-template-columns:1fr auto}.cart-item .qty{grid-row:2}.cart-item .line-total{grid-column:2;grid-row:2}.composer{flex-wrap:wrap}.composer textarea{width:100%;order:-1}.composer .btn{flex:1}.messages{height:430px}.data-table{min-width:700px}}
</style>

<script>
"use strict";
const SUPABASE_URL="https://adztwjcpdkjwdukluqqf.supabase.co";
const SUPABASE_KEY="sb_publishable_QVvC-98kyE0LSH2Tsl2gKA_ePU4NYWF";
const SB_HEADERS={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
const DB_KEY="fresh_meat_chicken_v5";
const SESSION_KEY="fresh_meat_session_v5";
const ADMIN_PASSWORD="Ahj1234"; // Change this before production.
const MEAT_IMAGE="https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=1000&q=85";

let db={customers:{},orders:[],products:[],offers:[],announcements:[],chats:{},contact:{whatsapp:"",telegram:"",siteUrl:location.href}};
let session=null,page="home",adminSelected=null,customerSearch="",cart=[];
let onlineReady=false,saveTimer=null,saveBusy=false,pollBusy=false,lastFingerprint="",pendingImage=null;

function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function isUUID(v){return typeof v==="string"&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)}
function time(ts){return ts?new Date(ts).toLocaleString([],{dateStyle:"short",timeStyle:"short"}):"—"}
function toast(title,msg=""){const t=document.getElementById("toast");if(!t)return;t.innerHTML="<b>"+esc(title)+"</b>"+(msg?`<div style="margin-top:4px;opacity:.82">${esc(msg)}</div>`:"");t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),4200)}
function setStatus(ok,msg){onlineReady=!!ok;const e=document.getElementById("dbStatus");if(e){e.textContent="● "+(msg||"Online DB");e.classList.toggle("ok",!!ok)}}
function saveLocal(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){console.warn(e)}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(DB_KEY)||"null");if(x)db=mergeShape(x)}catch(e){console.warn(e)}}
function mergeShape(x){return {customers:x.customers||{},orders:Array.isArray(x.orders)?x.orders:[],products:Array.isArray(x.products)?x.products:[],offers:Array.isArray(x.offers)?x.offers:[],announcements:Array.isArray(x.announcements)?x.announcements:[],chats:x.chats||{},contact:{whatsapp:x.contact?.whatsapp||"",telegram:x.contact?.telegram||"",siteUrl:x.contact?.siteUrl||location.href}}}
function normalizePhone(v){let s=String(v||"").trim().replace(/[^\d+]/g,"");if(/^03\d{9}$/.test(s))return "+92"+s.slice(1);if(/^\+923\d{9}$/.test(s))return s;if(/^923\d{9}$/.test(s))return "+"+s;return ""}
function validPhone(v){return !!normalizePhone(v)}
function productPrice(p){const n=Number(String(p.price||"").replace(/[^0-9.]/g,""));return Number.isFinite(n)?n:0}
function cartTotal(){return cart.reduce((s,i)=>s+i.qty*productPrice(i.product),0)}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0)}
function customerList(){return Object.values(db.customers||{})}
function meatProducts(){return (db.products||[]).filter(p=>p.active!==false)}
function getCustomer(id){return db.customers[id]}

function loginScreen(){
return `<div class="container login-wrap"><div class="card login">
<div class="brand">🐔 Fresh Meat Hub<small>Premium Chicken Ordering • AHJ Group</small></div>
<h2>Welcome</h2><p class="muted">Private customer ordering for fresh chicken products.</p>
<div class="role"><button id="customerRole" class="selected">Customer</button><button id="adminRole">Admin</button></div>
<div id="loginFields"><label>Customer Name</label><input id="loginName" placeholder="e.g. Ali Khan"><label>Customer ID / House No.</label><input id="loginCode" placeholder="e.g. H-12 or CUST-001"><label>Pakistan Mobile Number</label><input id="loginPhone" type="tel" inputmode="tel" placeholder="03XXXXXXXXX"><button class="btn" id="loginBtn" style="width:100%;margin-top:14px">Enter Customer Panel</button></div>
</div></div>`;
}

function shell(){
const nav=session.role==="customer"?`
<button data-page="home">Home</button><button data-page="meat">🐔 Chicken</button><button data-page="order">🛒 Cart (${cartCount()})</button><button data-page="chat">💬 Chat</button><button data-page="announcements">📢 Announcements</button><button data-page="contact">📞 Contact</button>`:
`<button data-page="dashboard">Dashboard</button><button data-page="customers">Customers</button><button data-page="products">Products</button><button data-page="orders">Orders</button><button data-page="offers">Offers</button><button data-page="announcementsAdmin">Announcements</button><button data-page="contactAdmin">Contact Settings</button><button data-page="adminchat">Chat Inbox</button>`;
return `<header class="topbar"><div class="brand">🐔 Fresh Meat Hub<small>Chicken Ordering System</small></div><span id="dbStatus" class="db-status">● Connecting…</span><nav class="nav">${nav}<button id="logout">Logout</button></nav></header><main class="container">${pageContent()}</main><footer>Fresh Meat Hub • Premium Chicken Service</footer>`;
}
function render(){document.getElementById("app").innerHTML=session?shell():loginScreen();if(session)bindPage();else setupLogin()}

function pageContent(){
if(session.role==="customer"){switch(page){case"home":return customerHome();case"meat":return meatCatalog();case"order":return orderPage();case"chat":return customerChat();case"announcements":return announcementPage();case"contact":return contactPage();default:return customerHome()}}
switch(page){case"dashboard":return adminDashboard();case"customers":return adminCustomers();case"products":return adminProducts();case"orders":return adminOrders();case"offers":return adminOffers();case"announcementsAdmin":return adminAnnouncements();case"contactAdmin":return adminContact();case"adminchat":return adminChat();default:return adminDashboard()}
}
function customerHome(){
const activeOffer=db.offers.find(x=>x.active);
return `${activeOffer?`<div class="card" style="margin-bottom:16px;border:2px solid #efd0d0"><span class="eyebrow">LIMITED OFFER</span><h2>${esc(activeOffer.title)}</h2><p class="muted">${esc(activeOffer.description||"Special chicken offer")}</p><button class="btn" data-page="meat">Shop Chicken</button></div>`:""}
<section class="hero"><div><span class="eyebrow">FRESH • CLEAN • FAST</span><h1>Premium Chicken, Delivered.</h1><p>Welcome <b>${esc(session.name||"Customer")}</b>. Choose multiple chicken products, add them to one cart and place one complete order.</p><button class="btn" data-page="meat">🐔 Shop Chicken</button></div><img src="${MEAT_IMAGE}" alt="Fresh chicken"></section>
<div class="section-title"><div><h2>Chicken Collection</h2><div class="muted">Rates are visible directly on every product card.</div></div></div>
<div class="grid grid3">${meatProducts().slice(0,6).map(productCard).join("")||`<div class="card empty">No chicken products are available yet.</div>`}</div>`;
}
function productCard(p){
const img=p.image||MEAT_IMAGE;
return `<div class="card product-card"><img src="${esc(img)}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><div class="product-meta"><span class="price">${esc(p.price||"Rate on request")}</span><span class="${p.active===false?"stock off":"stock"}">${p.active===false?"UNAVAILABLE":"AVAILABLE"}</span></div><div class="muted" style="font-size:12px;margin-top:5px">Product ID: ${esc(p.id)}</div><div class="product-actions">${p.active===false?`<button class="btn secondary" disabled>Unavailable</button>`:`<button class="btn" data-add="${esc(p.id)}">🛒 Add to Cart</button>`}</div></div>`;
}
function meatCatalog(){return `<div class="section-title"><div><h2>🐔 Chicken Products</h2><div class="muted">Only chicken products are shown. Admin can create any cut: leg piece, breast, wings, whole chicken, etc.</div></div></div><div class="grid grid3">${meatProducts().map(productCard).join("")||`<div class="card empty">Admin has not added a chicken product yet.</div>`}</div>`}
function orderPage(){
const items=cart.map(i=>`<div class="cart-item"><div><b>${esc(i.product.name)}</b><div class="muted">${esc(i.product.price)} • ID ${esc(i.product.id)}</div></div><div class="qty"><button data-dec="${esc(i.product.id)}">−</button><strong>${i.qty}</strong><button data-inc="${esc(i.product.id)}">+</button></div><div class="line-total price">Rs. ${(i.qty*productPrice(i.product)).toLocaleString()}</div><button class="btn secondary" data-remove="${esc(i.product.id)}">Remove</button></div>`).join("");
return `<div class="section-title"><div><h2>🛒 Your Chicken Cart</h2><div class="muted">All selected products will be submitted as one order.</div></div></div><div class="grid grid2"><div class="card">${items||`<div class="empty">Your cart is empty.<br><button class="btn" data-page="meat" style="margin-top:12px">Shop Chicken</button></div>`}${items?`<div class="cart-total"><span>Total</span><span class="price">Rs. ${cartTotal().toLocaleString()}</span></div><button class="btn secondary" id="clearCart" style="margin-top:12px">Clear Cart</button>`:""}</div>${items?`<div class="card"><h3>Delivery Details</h3><label>Customer Name *</label><input id="orderName" value="${esc(session.name||"")}"><label>Pakistan Mobile Number *</label><input id="orderPhone" type="tel" inputmode="tel" value="${esc(session.phone||"")}"><label>Customer ID / House Number *</label><input id="orderCustomerId" value="${esc(session.reference||"")}"><label>Complete Delivery Address *</label><textarea id="orderAddress" placeholder="House number, street, area, city — minimum 10 characters">${esc(session.address||"")}</textarea><label>Order Note (optional)</label><textarea id="orderNote" placeholder="Cutting preference or special instruction"></textarea><button class="btn" id="placeCartOrder" style="width:100%;margin-top:14px">Place Complete Order</button><div id="orderMsg"></div></div>`:""}</div>`;
}
function announcementPage(){return `<div class="section-title"><h2>📢 Announcements</h2></div>${db.announcements.filter(x=>x.active!==false).map(x=>`<div class="card announcement"><b>${esc(x.title||"Fresh Meat Hub")}</b><p>${esc(x.message||"")}</p><small class="muted">${time(x.createdAt)}</small></div>`).join("")||`<div class="card empty">No announcements right now.</div>`}`}
function contactPage(){
const w=normalizePhone(db.contact.whatsapp),tg=String(db.contact.telegram||"").trim(),site=db.contact.siteUrl||location.href;
return `<div class="section-title"><h2>📞 Contact</h2></div><div class="contact-grid">
<div class="card contact-card"><div class="contact-icon">💬</div><div><b>WhatsApp</b><div class="muted">Chat with us on WhatsApp</div>${w?`<a class="btn green" style="display:inline-block;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/${w.replace("+","")}">Open WhatsApp</a>`:`<div class="muted">Admin has not set a number.</div>`}</div></div>
<div class="card contact-card"><div class="contact-icon">✈️</div><div><b>Telegram</b><div class="muted">${esc(tg||"Contact not configured")}</div>${tg?`<a class="btn" style="display:inline-block;text-decoration:none;margin-top:8px" target="_blank" rel="noopener" href="${telegramHref(tg)}">Open Telegram</a>`:""}</div></div>
<div class="card contact-card"><div class="contact-icon">🌐</div><div><b>Customer Panel</b><div class="muted" style="word-break:break-all">${esc(site)}</div></div></div></div>`;
}
function telegramHref(v){return /^https?:\/\//i.test(v)?v:"https://t.me/"+v.replace(/^@/,"")}
function customerChat(){return chatView(session.customerId,true)}
function chatView(cid,isCustomer){
const msgs=db.chats[cid]||[];
return `<div class="dashboard-head"><h2 style="margin:0">💬 Private Chat</h2><span class="badge">PRIVATE</span></div><div class="card"><div class="messages" id="messages">${msgs.length?msgs.map(messageHTML).join(""):`<div class="empty">No messages yet.</div>`}</div>${composerHTML()}</div>`;
}
function composerHTML(){return `<div class="composer"><label class="file-btn">📷<input id="chatImage" type="file" accept="image/*"></label><textarea id="chatText" placeholder="Type a private message…"></textarea><button class="btn" id="sendChat">Send</button></div><div id="imageName" class="muted" style="font-size:11px;margin-top:5px">${pendingImage?"Image attached":""}</div>`}
function messageHTML(m){return `<div class="msg ${m.sender==="admin"?"admin":"customer"}">${m.text?`<div>${esc(m.text)}</div>`:""}${m.image?`<img src="${esc(m.image)}" style="max-width:230px;border-radius:10px;margin-top:6px" alt="attachment">`:""}<small>${m.sender==="admin"?"Admin":"You"} • ${time(m.ts)}</small></div>`}

function adminDashboard(){const cs=customerList();return `<div class="dashboard-head"><div><h2 style="margin:0">Admin Dashboard</h2><div class="muted">Chicken business control center</div></div></div><div class="stats"><div class="card stat">Customers<strong>${cs.length}</strong></div><div class="card stat">Products<strong>${db.products.length}</strong></div><div class="card stat">Orders<strong>${db.orders.length}</strong></div><div class="card stat">Active Offers<strong>${db.offers.filter(x=>x.active).length}</strong></div></div><div class="section-title"><h2>Quick Actions</h2></div><div class="grid grid3"><div class="card"><h3>🐔 Chicken Products</h3><p class="muted">Create unlimited chicken cuts and set rates yourself.</p><button class="btn" data-page="products">Manage Products</button></div><div class="card"><h3>👥 Customers</h3><p class="muted">Add customers, IDs, phone numbers and addresses.</p><button class="btn secondary" data-page="customers">Customers</button></div><div class="card"><h3>📦 Orders</h3><p class="muted">Review complete carts and update order status.</p><button class="btn secondary" data-page="orders">Open Orders</button></div></div>`}
function adminCustomers(){
const cs=customerList().filter(c=>{const q=customerSearch.toLowerCase();return !q||[c.name,c.customerCode,c.houseNumber,c.phone,c.address].some(v=>String(v||"").toLowerCase().includes(q))});

let editingCustomerId=null;
function openCustomerModal(cid=null){editingCustomerId=cid;const c=cid?db.customers[cid]:null;document.getElementById("customerModalTitle").textContent=c?"Edit Customer":"Add Customer";document.getElementById("cName").value=c?.name||"";document.getElementById("cCode").value=c?.customerCode||"";document.getElementById("cHouse").value=c?.houseNumber||"";document.getElementById("cPhone").value=c?.phone||"";document.getElementById("cAddress").value=c?.address||"";document.getElementById("customerModal").classList.add("show")}
function saveCustomer(){const name=document.getElementById("cName").value.trim(),code=document.getElementById("cCode").value.trim(),house=document.getElementById("cHouse").value.trim(),phone=normalizePhone(document.getElementById("cPhone").value),address=document.getElementById("cAddress").value.trim();if(!name||!code||!house||!phone)return toast("Validation","Enter name, unique ID, house identifier and valid Pakistan mobile.");if(address.length<10)return toast("Validation","Complete address must be at least 10 characters.");const duplicate=customerList().find(c=>c.customerCode.toLowerCase()===code.toLowerCase()&&c.id!==editingCustomerId);if(duplicate)return toast("Duplicate Customer","This Customer ID already exists.");const old=editingCustomerId?db.customers[editingCustomerId]:null;const idv=editingCustomerId||uid();db.customers[idv]={id:idv,customerCode:code,name,houseNumber:house,phone,address,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};db.chats[idv] ||= [];saveDB();document.getElementById("customerModal").classList.remove("show");toast("Customer saved","Saved to online database.");render()}
function adminProducts(){return `<div class="section-title"><div><h2>🐔 Chicken Products</h2><div class="muted">Only Chicken. Create any product or cut you sell.</div></div><button class="btn" id="addProduct">+ Add Chicken Product</button></div><div class="grid grid3">${db.products.map(p=>`<div class="card product-card"><img src="${esc(p.image||MEAT_IMAGE)}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><div class="price">${esc(p.price)}</div><div class="muted" style="font-size:12px;margin-top:5px">Product ID: ${esc(p.id)}</div><span class="${p.active===false?"stock off":"stock"}">${p.active===false?"UNAVAILABLE":"AVAILABLE"}</span><div class="product-actions"><button class="btn secondary" data-edit-product="${esc(p.id)}">Edit</button><button class="btn danger" data-delete-product="${esc(p.id)}">Delete</button></div></div>`).join("")||`<div class="card empty">Add your first chicken product, for example Leg Piece.</div>`}</div><div class="modal" id="productModal"><div class="modal-box"><h3 id="productModalTitle">Add Chicken Product</h3><div class="form-grid"><div><label>Product Name *</label><input id="pName" placeholder="Leg Piece"></div><div><label>Product ID *</label><input id="pId" placeholder="CHICK-001"></div><div><label>Rate / Price *</label><input id="pPrice" placeholder="720/kg"></div><div><label>Availability</label><select id="pActive"><option value="1">Available</option><option value="0">Unavailable</option></select></div><div class="full"><label>Product Image URL</label><input id="pImage" placeholder="https://..."></div><div class="full"><label>Or choose image</label><input id="pFile" type="file" accept="image/*"></div></div><div class="actions"><button class="btn" id="saveProduct">Save Product</button><button class="btn secondary" id="closeProduct">Cancel</button></div></div></div>`}
let editingProductId=null,productImageData=null;

function adminOrders(){return `<div class="section-title"><h2>📦 Orders</h2><button class="btn secondary" id="syncNow">↻ Sync Now</button></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Customer ID</th><th>Address</th><th>Products</th><th>Total</th><th>Date/Time</th><th>Status</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><b>${esc(o.id.slice(0,8))}</b></td><td>${esc(o.customerName)}</td><td>${esc(o.phone)}</td><td>${esc(o.customerCode)}</td><td>${esc(o.address)}</td><td>${orderItemsText(o)}</td><td class="price">Rs. ${Number(o.total||0).toLocaleString()}</td><td>${time(o.createdAt)}</td><td><select data-status="${esc(o.id)}">${["pending","confirmed","preparing","delivered","cancelled"].map(s=>`<option value="${s}" ${o.status===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></td></tr>`).join("")||`<tr><td colspan="9" class="empty">No orders yet.</td></tr>`}</tbody></table></div>`}

function adminOffers(){return `<div class="section-title"><h2>🎁 Offers</h2><button class="btn" id="addOffer">+ Add Offer</button></div><div class="grid grid2">${db.offers.map(o=>`<div class="card"><span class="badge">${o.active?"LIVE":"OFF"}</span><h3>${esc(o.title)}</h3><p class="muted">${esc(o.description||"")}</p><div class="actions"><button class="btn" data-toggle-offer="${esc(o.id)}">${o.active?"Turn Off":"Publish"}</button><button class="btn secondary" data-edit-offer="${esc(o.id)}">Edit</button><button class="btn danger" data-delete-offer="${esc(o.id)}">Delete</button></div></div>`).join("")||`<div class="card empty">No offers.</div>`}</div><div class="modal" id="offerModal"><div class="modal-box"><h3 id="offerTitleModal">Offer</h3><label>Title *</label><input id="oTitle"><label>Description</label><textarea id="oDesc"></textarea><div class="actions"><button class="btn" id="saveOffer">Save</button><button class="btn secondary" id="closeOffer">Cancel</button></div></div></div>`}
let editingOfferId=null;
function openOfferModal(idv=null){editingOfferId=idv;const o=idv?db.offers.find(x=>x.id===idv):null;document.getElementById("offerTitleModal").textContent=o?"Edit Offer":"Add Offer";document.getElementById("oTitle").value=o?.title||"";document.getElementById("oDesc").value=o?.description||"";document.getElementById("offerModal").classList.add("show")}
function adminAnnouncements(){return `<div class="section-title"><h2>📢 Announcements</h2><button class="btn" id="addAnnouncement">+ Add Announcement</button></div><div class="grid grid2">${db.announcements.map(a=>`<div class="card"><span class="badge">${a.active!==false?"ACTIVE":"OFF"}</span><h3>${esc(a.title||"Announcement")}</h3><p>${esc(a.message||"")}</p><div class="actions"><button class="btn" data-toggle-ann="${esc(a.id)}">${a.active!==false?"Deactivate":"Publish"}</button><button class="btn danger" data-delete-ann="${esc(a.id)}">Delete</button></div></div>`).join("")||`<div class="card empty">No announcements.</div>`}</div><div class="modal" id="annModal"><div class="modal-box"><h3>Announcement</h3><label>Title</label><input id="aTitle" placeholder="Fresh Chicken Available"><label>Message *</label><textarea id="aMessage"></textarea><div class="actions"><button class="btn" id="saveAnn">Publish</button><button class="btn secondary" id="closeAnn">Cancel</button></div></div></div>`}
function adminContact(){return `<div class="section-title"><h2>📞 Contact Settings</h2></div><div class="card"><label>WhatsApp Number</label><input id="setWhatsapp" value="${esc(db.contact.whatsapp||"")}" placeholder="03XXXXXXXXX"><label>Telegram Username or Link</label><input id="setTelegram" value="${esc(db.contact.telegram||"")}" placeholder="@yourusername or https://t.me/..."><label>Customer Panel / Site URL</label><input id="setSite" value="${esc(db.contact.siteUrl||location.href)}"><button class="btn" id="saveContact" style="margin-top:14px">Save Contact Settings</button></div><div class="card install-card" style="margin-top:14px"><h3>📲 Install</h3><p class="muted">On Android Chrome use ⋮ → Add to Home screen / Install app. On laptop Chrome/Edge use the browser install option.</p></div>`}
function adminChat(){const cs=customerList().filter(c=>{const q=customerSearch.toLowerCase();return !q||[c.name,c.phone,c.customerCode].some(v=>String(v||"").toLowerCase().includes(q))});const sel=db.customers[adminSelected];return `<div class="section-title"><h2>💬 Chat Inbox</h2></div><div class="chat-layout"><div class="card inbox"><input id="chatSearch" placeholder="Search customer…" value="${esc(customerSearch)}">${cs.map(c=>`<div class="customer-item ${adminSelected===c.id?"selected":""}" data-select-chat="${esc(c.id)}"><b>${esc(c.name)}</b><small class="muted" style="display:block">${esc(c.customerCode)} • ${esc(c.phone)}</small></div>`).join("")||`<div class="empty">No customers.</div>`}</div><div class="card">${sel?chatView(sel.id,false):`<div class="empty">Select a customer.</div>`}</div></div>`}

function bindPage(){
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
document.getElementById("logout")?.addEventListener("click",()=>{session=null;cart=[];localStorage.removeItem(SESSION_KEY);render()});
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addCart(b.dataset.add));
document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>changeCart(b.dataset.inc,1));
document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>changeCart(b.dataset.dec,-1));
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart=cart.filter(i=>i.product.id!==b.dataset.remove);render()});
document.getElementById("clearCart")?.addEventListener("click",()=>{cart=[];render()});
document.getElementById("placeCartOrder")?.addEventListener("click",placeCartOrder);
document.getElementById("addCustomer")?.addEventListener("click",()=>openCustomerModal());
document.querySelectorAll("[data-edit-customer]").forEach(b=>b.onclick=()=>openCustomerModal(b.dataset.editCustomer));
document.querySelectorAll("[data-delete-customer]").forEach(b=>b.onclick=()=>deleteCustomer(b.dataset.deleteCustomer));
document.querySelectorAll("[data-wa-customer]").forEach(b=>b.onclick=()=>openCustomerWhatsApp(b.dataset.waCustomer));
document.getElementById("saveCustomer")?.addEventListener("click",saveCustomer);document.getElementById("closeCustomer")?.addEventListener("click",()=>document.getElementById("customerModal").classList.remove("show"));
const cs=document.getElementById("customerSearch");if(cs)cs.oninput=e=>{customerSearch=e.target.value;render();setTimeout(()=>{const x=document.getElementById("customerSearch");x?.focus();x?.setSelectionRange(x.value.length,x.value.length)},0)}
document.getElementById("addProduct")?.addEventListener("click",()=>openProductModal());document.querySelectorAll("[data-edit-product]").forEach(b=>b.onclick=()=>openProductModal(b.dataset.editProduct));document.querySelectorAll("[data-delete-product]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.deleteProduct));document.getElementById("saveProduct")?.addEventListener("click",saveProduct);document.getElementById("closeProduct")?.addEventListener("click",()=>document.getElementById("productModal").classList.remove("show"));document.getElementById("pFile")?.addEventListener("change",readProductImage);
document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>updateOrderStatus(s.dataset.status,s.value));document.getElementById("syncNow")?.addEventListener("click",()=>syncOnlineNow(true));
document.getElementById("addOffer")?.addEventListener("click",()=>openOfferModal());document.querySelectorAll("[data-toggle-offer]").forEach(b=>b.onclick=()=>toggleOffer(b.dataset.toggleOffer));document.querySelectorAll("[data-delete-offer]").forEach(b=>b.onclick=()=>deleteOffer(b.dataset.deleteOffer));document.querySelectorAll("[data-edit-offer]").forEach(b=>b.onclick=()=>openOfferModal(b.dataset.editOffer));document.getElementById("saveOffer")?.addEventListener("click",saveOffer);document.getElementById("closeOffer")?.addEventListener("click",()=>document.getElementById("offerModal").classList.remove("show"));
document.getElementById("addAnnouncement")?.addEventListener("click",()=>document.getElementById("annModal").classList.add("show"));document.getElementById("closeAnn")?.addEventListener("click",()=>document.getElementById("annModal").classList.remove("show"));document.getElementById("saveAnn")?.addEventListener("click",saveAnnouncement);document.querySelectorAll("[data-toggle-ann]").forEach(b=>b.onclick=()=>{const a=db.announcements.find(x=>x.id===b.dataset.toggleAnn);if(a){a.active=a.active===false;saveDB();render()}});document.querySelectorAll("[data-delete-ann]").forEach(b=>b.onclick=()=>{if(confirm("Delete announcement?")){db.announcements=db.announcements.filter(x=>x.id!==b.dataset.deleteAnn);saveDB();render()}});
document.getElementById("saveContact")?.addEventListener("click",saveContact);
document.querySelectorAll("[data-select-chat]").forEach(b=>b.onclick=()=>{adminSelected=b.dataset.selectChat;page="adminchat";render()});const chs=document.getElementById("chatSearch");if(chs)chs.oninput=e=>{customerSearch=e.target.value;render();setTimeout(()=>document.getElementById("chatSearch")?.focus(),0)};
document.getElementById("sendChat")?.addEventListener("click",sendChat);document.getElementById("chatImage")?.addEventListener("change",handleChatImage);
document.getElementById("adminPass")?.addEventListener("keydown",e=>{if(e.key==="Enter")adminLogin()});
setStatus(onlineReady,onlineReady?"Online DB":"Connecting…");
}
function addCart(pid){const p=db.products.find(x=>x.id===pid&&x.active!==false);if(!p)return;const found=cart.find(i=>i.product.id===pid);if(found)found.qty++;else cart.push({product:{...p},qty:1});toast("Added to cart",p.name);render()}
function changeCart(pid,d){const x=cart.find(i=>i.product.id===pid);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i!==x);render()}
function deleteProduct(pid){if(!confirm("Delete this chicken product?"))return;db.products=db.products.filter(p=>p.id!==pid);cart=cart.filter(i=>i.product.id!==pid);saveDB();render()}
function deleteCustomer(cid){if(!confirm("Delete this customer? Existing orders remain. Chat will also be removed."))return;delete db.customers[cid];delete db.chats[cid];saveDB();if(adminSelected===cid)adminSelected=null;render()}
async function readProductImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>2.5*1024*1024)return toast("Image too large","Use an image under 2.5 MB.");if(!onlineReady){return toast("Online database required","Connect to Supabase before uploading an image.");}try{productImageData=await uploadImage(f);toast("Image uploaded","Product image is online.");}catch(err){console.error(err);toast("Image upload failed",err.message||"Try an image URL instead.");}}
function placeCartOrder(){
const name=document.getElementById("orderName").value.trim(),rawPhone=document.getElementById("orderPhone").value.trim(),phone=normalizePhone(rawPhone),code=document.getElementById("orderCustomerId").value.trim(),address=document.getElementById("orderAddress").value.trim(),note=document.getElementById("orderNote").value.trim();
if(!name)return toast("Required","Customer name is required.");if(!phone)return toast("Invalid mobile","Use 03XXXXXXXXX, +923XXXXXXXXX or 923XXXXXXXXX.");if(!code)return toast("Required","Customer ID / House Number is required.");if(address.length<10)return toast("Incomplete address","Delivery address must be at least 10 characters.");if(!cart.length)return toast("Cart empty","Add at least one chicken product.");
const known=customerList().find(c=>c.customerCode.toLowerCase()===code.toLowerCase());
if(known){db.customers[known.id]={...known,name,phone,address,houseNumber:known.houseNumber||code,updatedAt:Date.now()};session.customerId=known.id;session.reference=known.customerCode}else{const cid=uid();db.customers[cid]={id:cid,customerCode:code,name,houseNumber:code,phone,address,createdAt:Date.now(),updatedAt:Date.now()};db.chats[cid]=[];session.customerId=cid;session.reference=code}
session.name=name;session.phone=phone;session.address=address;
const items=cart.map(i=>({id:i.product.id,name:i.product.name,qty:i.qty,price:i.product.price,unitPrice:productPrice(i.product)}));const order={id:uid(),customerId:session.customerId,customerName:name,phone,address,customerCode:code,items,total:cartTotal(),note,product:items.map(i=>`${i.name} × ${i.qty}`).join(", "),quantity:items.reduce((s,i)=>s+i.qty,0),status:"pending",createdAt:Date.now(),updatedAt:Date.now()};db.orders.unshift(order);cart=[];saveDB();toast("Order submitted","Your complete chicken order was saved online.");page="home";render()
}
function updateOrderStatus(idv,status){const o=db.orders.find(x=>x.id===idv);if(!o)return;o.status=status;o.updatedAt=Date.now();saveDB();toast("Order updated",status)}
function saveOffer(){const title=document.getElementById("oTitle").value.trim(),description=document.getElementById("oDesc").value.trim();if(!title)return toast("Required","Offer title is required.");if(editingOfferId){const o=db.offers.find(x=>x.id===editingOfferId);if(o)Object.assign(o,{title,description,updatedAt:Date.now()})}else db.offers.push({id:uid(),title,description,active:false,createdAt:Date.now(),updatedAt:Date.now()});saveDB();document.getElementById("offerModal").classList.remove("show");render()}
function toggleOffer(idv){db.offers.forEach(o=>o.active=o.id===idv?!o.active:false);saveDB();render()}
function deleteOffer(idv){if(confirm("Delete offer?")){db.offers=db.offers.filter(o=>o.id!==idv);saveDB();render()}}
function saveAnnouncement(){const title=document.getElementById("aTitle").value.trim(),message=document.getElementById("aMessage").value.trim();if(!message)return toast("Required","Announcement message is required.");db.announcements.unshift({id:uid(),title:title||"Fresh Meat Hub",message,active:true,createdAt:Date.now()});saveDB();document.getElementById("annModal").classList.remove("show");render()}
function saveContact(){const whatsapp=document.getElementById("setWhatsapp").value.trim(),telegram=document.getElementById("setTelegram").value.trim(),siteUrl=document.getElementById("setSite").value.trim();if(whatsapp&&!validPhone(whatsapp))return toast("Invalid WhatsApp","Enter a valid Pakistan number.");db.contact={whatsapp:normalizePhone(whatsapp)||"",telegram,siteUrl:siteUrl||location.href};saveDB();toast("Contact settings saved","Settings are synchronized online.");render()}
function handleChatImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>2.5*1024*1024)return toast("Image too large","Use an image under 2.5 MB.");const r=new FileReader();r.onload=()=>{pendingImage=r.result;const x=document.getElementById("imageName");if(x)x.textContent="Image attached";};r.readAsDataURL(f)}
function sendChat(){const text=document.getElementById("chatText")?.value.trim()||"";const cid=session.role==="customer"?session.customerId:adminSelected;if(!cid)return toast("Select customer","Choose a customer first.");if(!text&&!pendingImage)return toast("Empty message","Type a message or attach an image.");db.chats[cid] ||= [];db.chats[cid].push({id:uid(),sender:session.role,text,image:pendingImage||"",ts:Date.now()});pendingImage=null;saveDB();render()}

function setupLogin(){let role="customer";const cr=document.getElementById("customerRole"),ar=document.getElementById("adminRole"),fields=document.getElementById("loginFields");if(!cr)return;cr.onclick=()=>{role="customer";cr.classList.add("selected");ar.classList.remove("selected");fields.innerHTML=`<label>Customer Name</label><input id="loginName" placeholder="e.g. Ali Khan"><label>Customer ID / House No.</label><input id="loginCode" placeholder="e.g. H-12 or CUST-001"><label>Pakistan Mobile Number</label><input id="loginPhone" type="tel" inputmode="tel" placeholder="03XXXXXXXXX"><button class="btn" id="loginBtn" style="width:100%;margin-top:14px">Enter Customer Panel</button>`;document.getElementById("loginBtn").onclick=customerLogin};ar.onclick=()=>{role="admin";ar.classList.add("selected");cr.classList.remove("selected");fields.innerHTML=`<label>Admin Password</label><input id="adminPass" type="password" placeholder="Enter admin password"><button class="btn" id="loginBtn" style="width:100%;margin-top:14px">Enter Admin Dashboard</button>`;document.getElementById("loginBtn").onclick=adminLogin}}
function customerLogin(){const name=document.getElementById("loginName")?.value.trim(),code=document.getElementById("loginCode")?.value.trim(),phone=normalizePhone(document.getElementById("loginPhone")?.value);if(!name||!code)return toast("Required","Enter customer name and Customer ID / House Number.");if(!phone)return toast("Invalid mobile","Use 03XXXXXXXXX, +923XXXXXXXXX or 923XXXXXXXXX.");const existing=customerList().find(c=>c.customerCode.toLowerCase()===code.toLowerCase());if(existing){if(existing.phone&&normalizePhone(existing.phone)!==phone)return toast("Customer verification failed","This Customer ID belongs to another mobile number.");existing.name=name;existing.phone=phone;existing.updatedAt=Date.now();session={role:"customer",customerId:existing.id,name,phone,reference:existing.customerCode,address:existing.address||""}}else{const cid=uid();db.customers[cid]={id:cid,customerCode:code,name,houseNumber:code,phone,address:"",createdAt:Date.now(),updatedAt:Date.now()};db.chats[cid]=[];session={role:"customer",customerId:cid,name,phone,reference:code,address:""}}saveDB();localStorage.setItem(SESSION_KEY,JSON.stringify(session));page="home";render()}
function adminLogin(){if(document.getElementById("adminPass").value!==ADMIN_PASSWORD)return toast("Access denied","Incorrect admin password.");session={role:"admin"};localStorage.setItem(SESSION_KEY,JSON.stringify(session));page="dashboard";render()}

async function sbFetch(table,params=""){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`,{headers:SB_HEADERS});if(!r.ok)throw new Error(`${table} ${r.status}: ${await r.text()}`);return r.status===204?[]:await r.json()}
async function sbWrite(table,body,method="POST",params=""){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`,{method,headers:{...SB_HEADERS,"Prefer":"return=minimal"},body:JSON.stringify(body)});if(!r.ok)throw new Error(`${table} ${r.status}: ${await r.text()}`)}
async function sbDelete(table,params){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`,{method:"DELETE",headers:SB_HEADERS});if(!r.ok)throw new Error(`${table} delete ${r.status}: ${await r.text()}`)}

async function uploadImage(file){
const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
const path="products/"+uid()+"."+ext;
const r=await fetch(`${SUPABASE_URL}/storage/v1/object/app-images/${path}`,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":file.type||"image/jpeg","x-upsert":"true"},body:file});
if(!r.ok)throw new Error("Storage "+r.status+": "+await r.text());
return `${SUPABASE_URL}/storage/v1/object/public/app-images/${path}`;
}
async function onlineLoad(){
const [customers,products,offers,announcements,orders,businesses,items,threads,messages,settings]=await Promise.all([
sbFetch("customers","?select=*&order=created_at.asc"),sbFetch("rates","?select=*&order=created_at.asc"),sbFetch("offers","?select=*&order=created_at.desc"),sbFetch("announcements","?select=*&order=created_at.desc"),sbFetch("orders","?select=*&order=created_at.desc"),sbFetch("businesses","?select=*&order=created_at.asc"),sbFetch("business_items","?select=*&order=sort_order.asc"),sbFetch("chat_threads","?select=*&order=created_at.asc"),sbFetch("chat_messages","?select=*&order=created_at.asc"),sbFetch("app_settings","?select=*&limit=1")
]);
const out={customers:{},orders:[],products:[],offers:[],announcements:[],chats:{},contact:{whatsapp:"",telegram:"",siteUrl:location.href}};
if(settings&&settings[0]){let d=settings[0].data||{};out.contact={whatsapp:d.whatsapp||"",telegram:d.telegram||"",siteUrl:d.siteUrl||location.href}};
customers.forEach(c=>{out.customers[c.customer_code]={id:c.id,customerCode:c.customer_code,name:c.name,phone:c.phone||"",houseNumber:c.house_number||c.customer_code,address:c.address||"",createdAt:c.created_at?new Date(c.created_at).getTime():Date.now(),updatedAt:c.updated_at?new Date(c.updated_at).getTime():Date.now()};});
products.forEach(p=>out.products.push({id:p.product_code||p.id,name:p.name,price:p.price||"Rate on request",image:p.image_url||MEAT_IMAGE,active:p.active!==false}));
offers.forEach(o=>out.offers.push({id:o.id,title:o.title,description:o.description||"",active:!!o.active,createdAt:new Date(o.created_at).getTime()}));
announcements.forEach(a=>out.announcements.push({id:a.id,title:a.title||"Fresh Meat Hub",message:a.message,active:a.active!==false,createdAt:new Date(a.created_at).getTime()}));
const itemMap={};items.forEach(i=>{itemMap[i.business_id] ||= [];itemMap[i.business_id].push(i)});
const meat=businesses.find(b=>String(b.code||"").toUpperCase()==="MEAT-001"||String(b.id)==="meat-shop"||String(b.name||"").toLowerCase()==="meat shop");
if(meat){(itemMap[meat.id]||[]).forEach(i=>out.products.push({id:i.product_code||i.id,name:i.name,price:i.price||"Rate on request",image:i.image_url||MEAT_IMAGE,active:i.active!==false,_uuid:i.id}))}
orders.forEach(o=>{let items2=[];try{items2=o.items_json?JSON.parse(o.items_json):[];if(!Array.isArray(items2))items2=[]}catch(e){}out.orders.push({id:o.id,customerId:o.customer_id,customerName:o.customer_name,phone:o.phone,address:o.address||"",customerCode:o.customer_code||"",items:items2,total:Number(o.total||0),note:o.note||"",product:o.product||"",quantity:Number(o.quantity||0),status:o.status||"pending",createdAt:new Date(o.created_at).getTime(),updatedAt:new Date(o.updated_at||o.created_at).getTime()})});
const threadMap={};threads.forEach(t=>{const c=customers.find(x=>x.id===t.customer_id);if(c){threadMap[t.id]=c.customer_code;out.chats[c.customer_code]=[]}});messages.forEach(m=>{const code=threadMap[m.thread_id];if(code)(out.chats[code] ||= []).push({id:m.id,sender:m.sender_type,text:m.text||"",image:m.image_url||"",ts:new Date(m.created_at).getTime(),readByAdmin:m.read_by_admin,readByCustomer:m.read_by_customer})});
return out;
}
function meatBusinessId(){return "meat-shop"}
async function onlineSave(){
if(!onlineReady||saveBusy)return false;saveBusy=true;
try{
const currentCustomers=Object.values(db.customers||{});
for(const c of currentCustomers){await sbWrite("customers",{id:isUUID(c.id)?c.id:uid(),customer_code:c.customerCode,name:c.name,phone:normalizePhone(c.phone),house_number:c.houseNumber||c.customerCode,address:c.address||""},"POST","?on_conflict=customer_code")}
const serverCustomers=await sbFetch("customers","?select=id,customer_code");const cmap={};serverCustomers.forEach(c=>cmap[c.customer_code]=c.id);
let meat= (await sbFetch("businesses","?select=*&code=eq.MEAT-001&limit=1"))[0];
if(!meat){await sbWrite("businesses",{id:meatBusinessId(),code:"MEAT-001",name:"Chicken",icon:"🐔",description:"Fresh chicken products",active:true},"POST");meat=(await sbFetch("businesses","?select=*&code=eq.MEAT-001&limit=1"))[0]}
const keepItems=[];for(let n=0;n<db.products.length;n++){const p=db.products[n],pid=isUUID(p._uuid)?p._uuid:uid();p._uuid=pid;keepItems.push(pid);await sbWrite("business_items",{id:pid,business_id:meat.id,product_code:p.id,name:p.name,price:p.price||"Rate on request",image_url:p.image||"",sort_order:n,active:p.active!==false},"POST","?on_conflict=id")}
const oldItems=await sbFetch("business_items",`?select=id&business_id=eq.${encodeURIComponent(meat.id)}`);for(const x of oldItems)if(!keepItems.includes(x.id))await sbDelete("business_items",`?id=eq.${encodeURIComponent(x.id)}`);
await sbWrite("app_settings",{id:"00000000-0000-0000-0000-000000000001",data:{whatsapp:db.contact.whatsapp||"",telegram:db.contact.telegram||"",siteUrl:db.contact.siteUrl||location.href}},"POST","?on_conflict=id");
for(const o of db.offers){const oid=isUUID(o.id)?o.id:uid();o.id=oid;await sbWrite("offers",{id:oid,title:o.title,description:o.description||"",image_url:"",active:!!o.active},"POST","?on_conflict=id")}
const serverOffers=await sbFetch("offers","?select=id");const keepOffers=new Set(db.offers.map(x=>String(x.id)));for(const x of serverOffers)if(!keepOffers.has(String(x.id)))await sbDelete("offers",`?id=eq.${encodeURIComponent(x.id)}`);
for(const a of db.announcements){const aid=isUUID(a.id)?a.id:uid();a.id=aid;await sbWrite("announcements",{id:aid,title:a.title||"Fresh Meat Hub",message:a.message,active:a.active!==false},"POST","?on_conflict=id")}
for(const o of db.orders){const oid=isUUID(o.id)?o.id:uid();o.id=oid;await sbWrite("orders",{id:oid,customer_id:cmap[o.customerCode]||null,customer_name:o.customerName,phone:o.phone,address:o.address||"",customer_code:o.customerCode,items_json:JSON.stringify(o.items||[]),product:o.product||"",quantity:Number(o.quantity)||0,total:Number(o.total)||0,note:o.note||"",status:o.status||"pending"},"POST","?on_conflict=id")}
for(const [code,msgs] of Object.entries(db.chats||{})){const cu=cmap[code];if(!cu)continue;let th=(await sbFetch("chat_threads",`?select=id&customer_id=eq.${encodeURIComponent(cu)}&limit=1`))[0];if(!th){const tid=uid();await sbWrite("chat_threads",{id:tid,customer_id:cu},"POST");th={id:tid}}for(const m of msgs){const mid=isUUID(m.id)?m.id:uid();m.id=mid;await sbWrite("chat_messages",{id:mid,thread_id:th.id,sender_type:m.sender,text:m.text||"",image_url:(m.image||"").startsWith("http")?m.image:"",read_by_admin:!!m.readByAdmin,read_by_customer:!!m.readByCustomer},"POST","?on_conflict=id")}}
saveLocal();return true
}catch(e){console.error("Supabase save failed",e);toast("Online save failed",e.message||"Check Supabase/RLS.");return false}finally{saveBusy=false}
}
function saveDB(){saveLocal();if(!onlineReady)return;clearTimeout(saveTimer);setStatus(true,"Saving…");saveTimer=setTimeout(async()=>{const ok=await onlineSave();setStatus(ok,"Saved Online")},350)}
async function syncOnlineNow(manual=false){
if(!onlineReady||pollBusy||saveBusy)return false;pollBusy=true;try{const fresh=await onlineLoad();const a=JSON.stringify(fresh),b=JSON.stringify(db);if(a!==b){db=fresh;saveLocal();if(session?.role==="customer"){const c=Object.values(db.customers).find(x=>x.id===session.customerId||x.customerCode===session.reference);if(c){session.name=c.name;session.phone=c.phone;session.address=c.address||"";localStorage.setItem(SESSION_KEY,JSON.stringify(session))}}render()}setStatus(true,"Online DB");if(manual)toast("Synced","Latest data loaded from Supabase.");return true}catch(e){console.error("Supabase sync failed",e);setStatus(false,"Sync error");if(manual)toast("Sync failed",e.message||"Supabase error.");return false}finally{pollBusy=false}}
async function bootSupabase(){
setStatus(false,"Connecting…");
try{const fresh=await onlineLoad();db=fresh;saveLocal();onlineReady=true;setStatus(true,"Online DB");render();lastFingerprint=JSON.stringify(db)}
catch(e){console.error("Supabase boot failed",e);onlineReady=false;setStatus(false,"Offline");render();toast("Database connection issue","Using temporary cache. Check Supabase/RLS settings.")}
}
setInterval(()=>{if(session&&onlineReady&&!saveBusy&&!saveTimer)syncOnlineNow(false)},7000);
window.addEventListener("online",()=>{if(session)syncOnlineNow(false)});
window.addEventListener("offline",()=>setStatus(false,"Offline"));

loadLocal();
try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){session=null}
render();
bootSupabase();
</script>
