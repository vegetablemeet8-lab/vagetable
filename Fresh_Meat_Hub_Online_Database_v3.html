<!-- Fresh Meat Hub Online Database v2 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Meat Hub - Private Customer Chat System</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f7f8;--card:#fff;--dark:#162126;--muted:#718087;--line:#e3e9eb;
  --accent:#c62828;--accent2:#8e1d1d;--soft:#fff1f1;--green:#198754;
}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.topbar{background:linear-gradient(135deg,#171f23,#2c363b);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:20px}.brand small{display:block;font-size:11px;opacity:.65;font-weight:500}
.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:transparent;color:#dce3e5;padding:9px 11px;border-radius:9px}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}
.container{max-width:1200px;margin:auto;padding:25px 18px}
.hero{background:linear-gradient(135deg,#fff,#fff6f6);border:1px solid #f1dede;border-radius:20px;padding:30px;display:grid;grid-template-columns:1.4fr .8fr;gap:25px;align-items:center}
.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:var(--muted);line-height:1.7}
.btn{background:var(--accent);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700}.btn:hover{background:var(--accent2)}
.btn.secondary{background:#edf1f2;color:#26343a}.btn.green{background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px #1b2a3008}
.grid{display:grid;gap:16px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-title h2{margin:0}
.rate{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.rate:last-child{border:0}
.price{font-weight:800;color:var(--accent)}
.meat-img{width:100%;height:170px;object-fit:cover;border-radius:12px}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}
input,textarea,select{width:100%;border:1px solid #d7e0e3;border-radius:10px;padding:11px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:#d25a5a;box-shadow:0 0 0 3px #c6282810}
textarea{min-height:90px;resize:vertical}
.notice{padding:12px;border-radius:10px;background:#f7f9fa;color:#53636a;margin:8px 0}
.badge{font-size:11px;background:#f2d7d7;color:#9e2020;padding:4px 8px;border-radius:999px;font-weight:800}
.login-wrap{min-height:75vh;display:grid;place-items:center}.login{max-width:460px;width:100%}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.role button{padding:12px;border-radius:10px;background:#edf1f2;font-weight:800}.role button.selected{background:var(--accent);color:#fff}
.dashboard-head{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:27px;margin-top:7px}
.chat-layout{display:grid;grid-template-columns:320px 1fr;gap:15px;min-height:610px}
.inbox{overflow:auto;max-height:610px}.customer-item{padding:13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.customer-item:hover,.customer-item.selected{background:#fff4f4}.customer-item strong{display:block}.customer-item small{color:var(--muted)}
.unread{background:var(--accent);color:#fff;border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:800}
.chat-box{display:flex;flex-direction:column;height:610px}.chat-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.messages{flex:1;overflow:auto;padding:18px;background:#f7f9fa}
.msg{max-width:72%;padding:10px 12px;border-radius:14px;margin:7px 0;box-shadow:0 2px 7px #00000008}
.msg.customer{background:#fff;border:1px solid var(--line);margin-right:auto}.msg.admin{background:#ffe8e8;margin-left:auto}
.msg img{max-width:240px;max-height:220px;border-radius:10px;margin-top:7px;display:block}
.msg small{display:block;color:#8a969b;font-size:10px;margin-top:5px}
.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:end}.composer textarea{min-height:45px;height:45px}.file-btn{background:#edf1f2;padding:12px;border-radius:10px}.file-btn input{display:none}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
.search{margin-bottom:8px}.search input{padding:10px}
.profile-row{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffe1e1;color:#a51e1e;font-weight:900}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-box{background:#fff;border-radius:16px;max-width:500px;width:100%;padding:20px}
footer{text-align:center;color:#8a969b;padding:25px}
@media(max-width:850px){
 .hero{grid-template-columns:1fr}.grid3,.grid2,.stats{grid-template-columns:1fr 1fr}
 .chat-layout{grid-template-columns:1fr}.inbox{max-height:260px}.chat-box{height:560px}
}
@media(max-width:560px){
 .topbar{align-items:flex-start;flex-direction:column}.nav{width:100%;overflow:auto}
 .hero h1{font-size:29px}.grid3,.grid2,.stats{grid-template-columns:1fr}
 .container{padding:15px 11px}.chat-layout{gap:10px}.msg{max-width:88%}
}

.offer-banner{position:relative;background:linear-gradient(135deg,#fff1f1,#fff);border:2px solid #efb4b4;border-radius:18px;overflow:hidden;margin-bottom:20px;display:grid;grid-template-columns:1.15fr .85fr;min-height:190px;box-shadow:0 10px 30px #8e1d1d12}.offer-banner img{width:100%;height:100%;min-height:190px;object-fit:cover}.offer-copy{padding:25px}.offer-copy span{font-size:11px;font-weight:900;color:var(--accent);letter-spacing:1px}.offer-copy h2{margin:8px 0}.offer-copy p{color:var(--muted)}.offer-close{position:absolute;right:10px;top:8px;width:32px;height:32px;border-radius:50%;background:#ffffffdd;color:#333;font-size:24px;z-index:2}.product-card{overflow:hidden}.product-card .meat-img{height:190px;margin:-18px -18px 14px;width:calc(100% + 36px);border-radius:0}.product-info{display:flex;justify-content:space-between;align-items:center;gap:10px}.product-info h3{margin:0 0 10px}@media(max-width:650px){.offer-banner{grid-template-columns:1fr}.offer-banner img{height:170px;min-height:170px}.offer-copy{padding:18px}}

/* Multi-business, voice & PWA upgrades */
.business-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.business-card{position:relative;overflow:hidden;border:2px solid #c62828;background:linear-gradient(135deg,#fff,#fff3f3)}.business-card h3{color:#b71c1c;font-size:24px;margin:4px 0 8px}.business-card .shop-label{display:inline-block;background:#c62828;color:#fff;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.5px}.business-icon{font-size:44px;margin-bottom:8px}
.business-card .business-items{margin-top:12px}.business-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.business-item-left{display:flex;align-items:center;gap:9px;min-width:0}.business-item-img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#f3f3f3}.business-item-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.business-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.shop-cover{width:100%;height:180px;object-fit:cover;border-radius:14px;margin-bottom:12px}.business-product-row{display:grid;grid-template-columns:1.2fr .8fr 1.2fr auto;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}.business-product-row img{width:54px;height:54px;border-radius:10px;object-fit:cover;display:block}.business-product-row .remove-item{height:42px}.business-detail-list{display:grid;gap:10px}.business-detail-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px}.business-detail-item img{width:60px;height:60px;border-radius:10px;object-fit:cover}.business-detail-item .grow{flex:1;min-width:0}
.business-item:last-child{border-bottom:0}.front-rates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.front-rate{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.voice-btn{background:#edf1f2;color:#26343a;padding:11px 13px;border-radius:10px;font-weight:800}.voice-btn.recording{background:#ffe1e1;color:#a51e1e}
.voice-btn{min-width:48px;background:#eef3f5;color:#26343a;border-radius:10px;font-size:20px}.voice-btn.recording{background:#c62828;color:#fff;animation:pulseVoice 1s infinite}.voice-message{display:flex;align-items:center;gap:8px;margin-top:4px}.voice-message audio{max-width:240px;height:38px}.notify-btn{margin-top:10px}.notification-toast{position:fixed;right:18px;bottom:18px;z-index:9999;background:#162126;color:#fff;padding:16px 18px;border-radius:14px;box-shadow:0 10px 35px #0005;display:none;max-width:340px}.notification-toast.show{display:block;animation:toastIn .25s ease}@keyframes pulseVoice{50%{transform:scale(1.08)}}@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.install-card{background:linear-gradient(135deg,#fff,#f6fbff);border:1px solid #dbe7ef}
.install-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.install-step{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chat-voice-status{font-size:11px;color:var(--muted);padding:0 12px 6px}
@media(max-width:850px){.business-grid,.front-rates{grid-template-columns:1fr 1fr}.install-steps{grid-template-columns:1fr}}
@media(max-width:560px){.business-grid,.front-rates{grid-template-columns:1fr}.front-rate{padding:12px}}
.online-status{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#eee;color:#555;font-size:12px;font-weight:700}.online-status.ok{background:#e8f7ed;color:#137333}/* v3 professional mobile polish */
.login{max-width:460px!important;margin:24px auto!important;border-radius:24px!important;box-shadow:0 18px 55px rgba(0,0,0,.14)!important}
.login input{min-height:50px!important;border-radius:12px!important;font-size:16px!important}
.shop-label{margin-bottom:4px}
@media(max-width:700px){.container{padding:12px!important}.login{margin:8px auto!important;padding:18px!important}.business-detail-item{align-items:flex-start!important}.business-detail-item .btn{min-width:110px}.nav{overflow-x:auto!important;flex-wrap:nowrap!important;padding-bottom:5px}.nav button{white-space:nowrap!important}.topbar{position:sticky!important;top:0!important;z-index:50}}
</style>

</style>
<style id="v9-easy-editor">.business-product-row{display:grid;grid-template-columns:1.2fr .8fr .8fr 1.2fr .7fr auto;gap:8px;align-items:end;padding:10px;margin:10px 0;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa}.business-product-row label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.business-product-row input,.business-product-row select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d1d5db;border-radius:8px}@media(max-width:850px){.business-product-row{grid-template-columns:1fr 1fr}.business-product-row>div:last-child{grid-column:1/-1}}</style>
<style id="v10-mobile-price-style">
/* Mobile-first admin/product editor */

<body>

<div id="app"></div><div id="notificationToast" class="notification-toast"></div>

<script>
const DB_KEY="fresh_meat_private_system_v4";
const ADMIN_PASSWORD="Ahj1234";

const defaultDB={
 customers:{}, orders:[],
 rates:[],
 vegetables:[
 {id:"v1",name:"Potato",price:"Rs. 120/kg",image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=700&q=80"},
 {id:"v2",name:"Tomato",price:"Rs. 180/kg",image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=700&q=80"},
 {id:"v3",name:"Onion",price:"Rs. 150/kg",image:"https://images.unsplash.com/photo-1587049352846-4a222e784d38?auto=format&fit=crop&w=700&q=80"},
 {id:"v4",name:"Carrot",price:"Rs. 160/kg",image:"https://images.unsplash.com/photo-1445282768818-728615cc910a?auto=format&fit=crop&w=700&q=80"},
 {id:"v5",name:"Cucumber",price:"Rs. 140/kg",image:"https://images.unsplash.com/photo-1449300079323-02e209d9d3a6?auto=format&fit=crop&w=700&q=80"},
 {id:"v6",name:"Capsicum",price:"Rs. 280/kg",image:"https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?auto=format&fit=crop&w=700&q=80"},
 {id:"v7",name:"Cauliflower",price:"Rs. 220/kg",image:"https://images.unsplash.com/photo-1568584711075-3d021a7c3ca3?auto=format&fit=crop&w=700&q=80"},
 {id:"v8",name:"Spinach",price:"Rs. 100/bundle",image:"https://images.unsplash.com/photo-1576045057995-568f588f82fb?auto=format&fit=crop&w=700&q=80"},
 {id:"v9",name:"Peas",price:"Rs. 350/kg",image:"https://images.unsplash.com/photo-1587486913049-53fc88980cfc?auto=format&fit=crop&w=700&q=80"},
 {id:"v10",name:"Garlic",price:"Rs. 420/kg",image:"https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?auto=format&fit=crop&w=700&q=80"},
 {id:"v11",name:"Ginger",price:"Rs. 550/kg",image:"https://images.unsplash.com/photo-1615485737651-9d2f1f0e2d3b?auto=format&fit=crop&w=700&q=80"},
 {id:"v12",name:"Lemon",price:"Rs. 260/kg",image:"https://images.unsplash.com/photo-1590502593747-42a996133562?auto=format&fit=crop&w=700&q=80"}],
 offers:[],
 announcements:["Fresh meat and fresh vegetables available today. Contact us through private chat for details."],
 chats:{},
 businesses:[
  {id:"meat-shop",code:"MEAT-001",name:"Meat Shop",icon:"🥩",description:"Add your own meat products and rates.",image:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?auto=format&fit=crop&w=900&q=80",active:true,items:[]},
  {id:"vegetable-shop",code:"VEG-001",name:"Vegetable Shop",icon:"🥕",description:"Fresh vegetables with current rates.",image:"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=900&q=80",active:true,items:[
   {id:"veg-potato",name:"Potato",price:"Rs. 120/kg",image:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=700&q=80"},
   {id:"veg-tomato",name:"Tomato",price:"Rs. 180/kg",image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=700&q=80"},
   {id:"veg-onion",name:"Onion",price:"Rs. 150/kg",image:"https://images.unsplash.com/photo-1587049352846-4a222e784d38?auto=format&fit=crop&w=700&q=80"}
  ]}
 ]
};

let db=loadDB();
// Remove the old built-in Beef/Mutton/Chicken catalog so only products created by Admin are shown.
(function cleanLegacyMeat(){
  if(!db) return;
  db.rates=(db.rates||[]).filter(r=>!['beef','mutton','chicken'].includes(String(r.name||'').trim().toLowerCase()));
  const meat=(db.businesses||[]).find(b=>b.id==='meat-shop'||b.code==='MEAT-001'||String(b.name||'').trim().toLowerCase()==='meat shop');
  if(meat) meat.items=(meat.items||[]).filter(i=>!['beef','mutton','chicken'].includes(String(i.name||'').trim().toLowerCase()) && !['meat-beef','meat-mutton','meat-chicken'].includes(String(i.id||'')));
  try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}
})();
let session=JSON.parse(localStorage.getItem("fresh_meat_session")||"null");
let page="home", adminSelected=null, customerSearch="", pendingImage=null, pendingAudio=null;
let mediaRecorder=null, audioChunks=[], voiceStream=null, lastSeenChatSignature="";

function loadDB(){
 try{const s=JSON.parse(localStorage.getItem(DB_KEY)||"{}");return {
  customers:s.customers||{},orders:s.orders||[],rates:Array.isArray(s.rates)?s.rates:defaultDB.rates,
  vegetables:s.vegetables||defaultDB.vegetables,offers:s.offers||[],businesses:(Array.isArray(s.businesses)&&s.businesses.length?s.businesses:JSON.parse(JSON.stringify(defaultDB.businesses||[]))),
  announcements:s.announcements||defaultDB.announcements,chats:s.chats||{}
 }}catch(e){return JSON.parse(JSON.stringify(defaultDB))}
}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}

async function setupVoiceRecorder(){
 const btn=document.getElementById("voiceInput"); if(!btn)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
   btn.title="Voice recording is not supported here. Open in Chrome/Edge over HTTPS or localhost.";
   btn.onclick=()=>alert("Voice recording needs Chrome/Edge and microphone permission. If this HTML is opened directly as a file, use a local server or HTTPS.");
   return;
 }
 btn.onclick=async()=>{
   if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return;}
   try{
     voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
     const mime=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":(MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"");
     mediaRecorder=new MediaRecorder(voiceStream,mime?{mimeType:mime}:undefined); audioChunks=[];
     mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};
     mediaRecorder.onstop=()=>{
       const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||"audio/webm"});
       const reader=new FileReader(); reader.onload=()=>{pendingAudio=reader.result; const n=document.getElementById("imageName");if(n)n.textContent="🎙️ Voice message ready — press Send";}; reader.readAsDataURL(blob);
       voiceStream?.getTracks().forEach(t=>t.stop()); voiceStream=null; btn.classList.remove("recording");btn.textContent="🎙️";
     };
     mediaRecorder.onerror=()=>{voiceStream?.getTracks().forEach(t=>t.stop());voiceStream=null;btn.classList.remove("recording");btn.textContent="🎙️";alert("Voice recording stopped because of a microphone error.");};
     mediaRecorder.start(); btn.classList.add("recording");btn.textContent="⏹️";
   }catch(e){alert("Microphone permission is required for voice messages. Please allow Microphone and try again.");}
 };
}
function setupNotifications(){
 const enable=document.getElementById("enableNotifications"); if(enable)enable.onclick=requestNotifications;
 if("Notification" in window&&Notification.permission==="default"){}
}
async function requestNotifications(){
 if(!("Notification" in window)){alert("This browser does not support notifications.");return;}
 const p=await Notification.requestPermission();
 if(p==="granted"){playNotificationSound();showNotificationToast("Notifications enabled","You will be alerted for new chat messages on this device.");}
 else alert("Notifications were blocked. Enable them in your browser settings.");
}
function playNotificationSound(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(660,c.currentTime+.18);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.5);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.5);}catch(e){}
}
function showNotificationToast(title,body){const t=document.getElementById("notificationToast");if(t){t.innerHTML=`<b>${esc(title)}</b><div style="margin-top:5px;opacity:.85">${esc(body)}</div>`;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),5000);}}
function notifyNewMessage(m){
 playNotificationSound();
 showNotificationToast(m.sender==="admin"?"New message from Admin":"New customer message",m.text||"🎙️ Voice / image message");
 if("Notification" in window&&Notification.permission==="granted"){try{new Notification(m.sender==="admin"?"Fresh Meat Hub — New Message":"Fresh Meat Hub — New Customer Message",{body:m.text||"You received a voice/image message",tag:"fresh-meat-chat"});}catch(e){}}
}
function watchForNewMessages(){
 if(!session)return; const cid=session.role==="customer"?session.customerId:adminSelected; if(!cid)return;
 const msgs=db.chats[cid]||[]; const sig=msgs.map(m=>m.id).join("|");
 if(lastSeenChatSignature&&sig!==lastSeenChatSignature){const old=new Set(lastSeenChatSignature.split("|"));const incoming=msgs.filter(m=>!old.has(m.id)&&m.sender!==session.role);incoming.forEach(notifyNewMessage);}
 lastSeenChatSignature=sig;
}
let onlinePollBusy=false;
async function syncOnlineNow(){
  if(!onlineReady || onlinePollBusy) return;
  onlinePollBusy=true;
  try{
    const fresh=await onlineLoad();
    const localSnapshot=JSON.stringify(db);
    const freshSnapshot=JSON.stringify(fresh);
    if(localSnapshot!==freshSnapshot){
      db=fresh;
      localSaveDB();
      if(session?.role==="customer" && db.customers[session.customerId]){
        session.name=db.customers[session.customerId].name;
        session.phone=db.customers[session.customerId].phone||"";
        localStorage.setItem("fresh_meat_session",JSON.stringify(session));
      }
      render();
    }
    window.dispatchEvent(new CustomEvent("online-sync-status",{detail:{online:true}}));
  }catch(e){
    console.warn("Online sync failed:",e);
    window.dispatchEvent(new CustomEvent("online-sync-status",{detail:{online:false}}));
  }finally{onlinePollBusy=false;}
}
setInterval(()=>{if(session)syncOnlineNow();},3000);

async function sbFetch(table, params=""){

  if(!r.ok) throw new Error(table+" "+r.status+" "+await r.text());
  return r.status===204?[]:r.json();
}
async function sbWrite(table, body, method="POST", params=""){

  if(!r.ok) throw new Error(table+" "+r.status+" "+await r.text());
}
async function sbDelete(table, params){

    // Catalog/offers/businesses use upsert. IDs are normalized to UUIDs when needed.
    for(const r of (db.rates||[])){const uuid=isUUID(r.id)?r.id:sbId();r.id=uuid;await sbWrite("rates",{id:uuid,name:r.name,price:r.price,active:true},"POST","?on_conflict=id");}
    for(const v of (db.vegetables||[])){const uuid=isUUID(v.id)?v.id:sbId();v.id=uuid;await sbWrite("vegetables",{id:uuid,name:v.name,price:v.price,image_url:v.image||"",active:true},"POST","?on_conflict=id");}
    for(const o of (db.offers||[])){const uuid=isUUID(o.id)?o.id:sbId();o.id=uuid;await sbWrite("offers",{id:uuid,title:o.title,description:o.description||"",image_url:o.image||"",active:!!o.active},"POST","?on_conflict=id");}
    for(const b of (db.businesses||[])){const uuid=isUUID(b.id)?b.id:sbId();b.id=uuid;await sbWrite("businesses",{id:uuid,code:b.code||uuid,name:b.name,icon:b.icon||"🏪",description:b.description||"",image_url:b.image||"",active:b.active!==false},"POST","?on_conflict=id");
      const keepItemIds=[]; for(let i=0;i<(b.items||[]).length;i++){const x=b.items[i],iu=isUUID(x.id)?x.id:sbId();x.id=iu;keepItemIds.push(iu);await sbWrite("business_items",{id:iu,business_id:uuid,name:x.name,price:x.price||"Rate on request",image_url:x.image||"",sort_order:i},"POST","?on_conflict=id");}
      const oldItems=await sbFetch("business_items",`?select=id&business_id=eq.${encodeURIComponent(uuid)}`); for(const oi of oldItems){if(!keepItemIds.includes(oi.id))await sbDelete("business_items",`?id=eq.${encodeURIComponent(oi.id)}`);}
    }

    for(const o of (db.orders||[])){const uuid=isUUID(o.id)?o.id:sbId();o.id=uuid;await sbWrite("orders",{id:uuid,customer_id:cMap[o.customerId]||null,customer_name:o.name,phone:o.phone,product:o.product,quantity:Number(o.qty)||0,note:o.note||"",status:o.status||"pending"},"POST","?on_conflict=id");}
    // Private chat: one thread per customer and message upserts.
    for(const [code,msgs] of Object.entries(db.chats||{})){

      let threads=await sbFetch("chat_threads",`?select=id&customer_id=eq.${encodeURIComponent(customerUuid)}&limit=1`);
      let threadId=threads[0]?.id; if(!threadId){threadId=sbId();await sbWrite("chat_threads",{id:threadId,customer_id:customerUuid},"POST");}

function isUUID(v){return typeof v==="string"&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)}
/* ONLINE DATABASE SYNC v2 */
let dbV3SaveTimer=null;
let dbV3SavePromise=null;
let dbV3Revision=0;
let dbV3Status="offline";

function dbFingerprint(x){
  try{return JSON.stringify(x||{});}catch(e){return "";}
}
function hasUsefulLocalData(x){
  if(!x)return false;
  const keys=["customers","rates","vegetables","offers","announcements","orders","businesses","businessItems","chatThreads","chatMessages"];
  return keys.some(k=>Array.isArray(x[k])&&x[k].length);
}
function setOnlineStatus(ok,msg){
  dbV3Status=ok?"online":"offline";
  const el=document.getElementById("dbV3Status");
  if(el){
    el.textContent=msg||(ok?"Online DB":"Offline");
    el.classList.toggle("ok",!!ok);
  }
}
async function syncOnlineNow(reason){
  if(onlineSaveBusy||!session||!onlineReady)return false;
  if(dbV3SavePromise||dbV3SaveTimer)return true;
  onlineSaveBusy=true;
  try{
    const fresh=await onlineLoad();
    if(!fresh){setOnlineStatus(false,"Offline");return false;}
    if(dbFingerprint(fresh)!==dbFingerprint(db)){
      db=fresh;
      localSaveDB();
      render();
    }
    setOnlineStatus(true,"Online DB");
    return true;
  }catch(e){
    console.warn("Online sync failed:",e);
    setOnlineStatus(false,"Offline");
    return false;
  }finally{onlineSaveBusy=false;}
}
function queueOnlineSave(){
  if(!onlineReady)return;
  clearTimeout(dbV3SaveTimer);
  dbV3SaveTimer=setTimeout(async()=>{
    dbV3SaveTimer=null;
    if(dbV3SavePromise)return;
    const rev=dbV3Revision;
    dbV3SavePromise=(async()=>{
      try{
        await onlineSave();
        setOnlineStatus(true,"Saved Online");
      }catch(e){
        console.warn("Online save failed:",e);
        setOnlineStatus(false,"Save failed");
      }finally{
        dbV3SavePromise=null;
        if(dbV3Revision!==rev)queueOnlineSave();
      }
    })();
    await dbV3SavePromise;
  },300);
}
const localSaveDB=saveDB;
saveDB=function(){
  localSaveDB();
  dbV3Revision++;
  setOnlineStatus(onlineReady,"Saving Online");
  queueOnlineSave();
};

async function bootSupabase(){
  try{
    const localBefore=db;
    const online=await onlineLoad();
    if(online){
      if(hasUsefulLocalData(localBefore)&&!hasUsefulLocalData(online)){
        db=localBefore;
        onlineReady=true;
        await onlineSave();
      }else{
        db=online;
        onlineReady=true;
      }
      localSaveDB();
      setOnlineStatus(true,"Online DB");
      render();
      return true;
    }
  }catch(e){console.warn("Supabase boot failed:",e);}
  onlineReady=false;
  setOnlineStatus(false,"Offline");
  render();
  return false;
}
